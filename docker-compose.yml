version: '3.8'

services:
  mongodb:
    image: mongo:8.0
    container_name: cybergrid-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: cybergrid
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cybergrid-app
    restart: unless-stopped
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongodb:27017/cybergrid
      # Generate these with: openssl rand -base64 32
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-change-me-in-production}
      APP_URL: ${APP_URL:-http://localhost:3000}
      # Set to 1 if behind a reverse proxy (nginx, traefik, etc.)
      TRUST_PROXY: ${TRUST_PROXY:-0}
    ports:
      - "3000:3000"
    depends_on:
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/api/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s

volumes:
  mongodb_data: